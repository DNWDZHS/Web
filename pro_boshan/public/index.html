<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- 添加一个简单的缩略图标 favicon -->
     <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☸</text></svg>">

    <!-- 移动设备触摸优化 -->
    <script>
      // 等待DOM加载完成
      document.addEventListener('DOMContentLoaded', function() {
        // 检测触摸设备
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        
        if (isTouchDevice) {
          // 为所有可点击元素添加触摸事件处理
          const clickableElements = document.querySelectorAll('button, .click-btn, .image-container, .originSun');
          
          clickableElements.forEach(element => {
            // 阻止默认触摸行为
            element.addEventListener('touchstart', function(e) {
              e.preventDefault();
            }, { passive: false });
            
            element.addEventListener('touchmove', function(e) {
              e.preventDefault();
            }, { passive: false });
            
            element.addEventListener('touchend', function(e) {
              e.preventDefault();
              // 触发点击事件
              this.click();
            }, { passive: false });
          });
        }
      });
    </script>
     
    <title>Cyber Muyu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-image: url('background/bkg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #e0f2e9; /* 竹青文字，比纯白更柔和 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直居中主体内容 */
            align-items: center;
            padding: 10px;
            overflow-x: hidden;

        /* 给容器添加半透明背景色，确保内容清晰可见 */
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            margin: 0 auto;
            background-color: rgba(139, 254, 189, 0.05); /* 竹青底色 */
            backdrop-filter: blur(4px); /* 毛玻璃效果（现代浏览器支持） */
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 30, 60, 0.4); /* 青灰阴影 */

            border: 1px solid rgba(70, 130, 180, 0.3); /* 竹青边框 */

        .title {
            font-size: 2.5rem;
            margin: 20px 0;

                0 0 12px rgba(255, 215, 0, 0.8), /* 金色光晕 */

            letter-spacing: 2px;
            font-family: 'STKaiti', 'KaiTi', 'SimSun', serif; /* 书法字体 */
            font-weight: bold;
        }
        
        /* 确保interactive-area允许子元素溢出, 主要用于限制阳光生成范围 */
        .interactive-area {
            position: relative;
            width: 100%;
            height: auto; /* 改为自适应高度 */
            min-height: 280px; /* 保证最小高度 */
            max-height: 320px; /* 限制最大高度 */
            padding: 10px 0;
            display: flex;
            flex-direction: column; /* 子元素垂直排列 */
            align-items: center; /* 水平居中 */
            justify-content: center;
            margin-bottom: 16px;
            padding-top: 70px; /* ≈ 高度(40px图标+上下padding)+安全余量 */
            box-sizing: border-box;
            overflow: visible;

            /* 长方形固定圆角值 */
            border-radius: 15px;
            /* 添加山水层次感 */
            background: linear-gradient(to bottom, 
                rgba(10, 30, 50, 0.1) 0%, 
                rgba(10, 30, 50, 0.3) 100%);
        }
        
        /* 木鱼图标及经文选择按钮 */
        .image-container {
            position: relative;
            width: 300px;
            height: 300px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* cursor: pointer; */

            transform-origin: center;
            /* 木鱼容器边框 正方形百分比圆角值 */
            border-radius: 5%;
            box-shadow: 0 0 15px rgba(30, 80, 100, 0.3);
        }

        .image-container img {
           max-width: 100%; /* 图片最大宽度 */
           max-height: 100%; /* 图片最大高度 */
           object-fit: contain; /* 图片按比例缩放 */
        }

        /* 添加了active类的image-container元素 */
        .image-container.active {
            transform: scaleX(1.3) scaleY(0.7);
        }
        
        /* 用于功德+1的效果 */
        .merit-text {
            position: absolute;
            left: 0;
            bottom: 0;
            color: #a8d8b9; /* 竹青色 */

            font-size: 1.5rem;
            text-shadow: 0 0 6px rgba(100, 180, 180, 0.8); /* 青玉光晕 */

            transition: opacity 0.3s ease;
        }
        
        .merit-text.show {
            top: 0;
            opacity: 1;
        }
        
        /* 点击后显示经文的区域 */
        .moral-control-area {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 12px;
            padding: 10px;
            z-index: 15;
            /* 背景和边框可保持透明 */
        }

        .originSun {

            height: 40px;
            /* cursor: pointer; */

            display: flex;
            align-items: center;
            justify-content: center;
        }

            animation: sunPulse 2s ease-in-out infinite;
        }

        .originSun::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: conic-gradient(
                transparent 0deg, 
                rgba(255, 230, 0, 1) 10deg, 
                transparent 15deg, 
                rgba(255, 230, 0, 1) 25deg, 
                transparent 30deg, 
                rgba(255, 230, 0, 1) 40deg, 
                transparent 45deg, 
                rgba(255, 230, 0, 1) 55deg, 
                transparent 60deg, 
                rgba(255, 230, 0, 1) 70deg, 
                transparent 75deg, 
                rgba(255, 230, 0, 1) 85deg, 
                transparent 90deg, 
                rgba(255, 230, 0, 1) 100deg, 
                transparent 105deg, 
                rgba(255, 230, 0, 1) 115deg, 
                transparent 120deg, 
                rgba(255, 230, 0, 1) 130deg, 
                transparent 135deg, 
                rgba(255, 230, 0, 1) 145deg, 
                transparent 150deg, 
                rgba(255, 230, 0, 1) 160deg, 
                transparent 165deg, 
                rgba(255, 230, 0, 1) 175deg, 
                transparent 180deg, 
                rgba(255, 230, 0, 1) 190deg, 
                transparent 195deg, 
                rgba(255, 230, 0, 1) 205deg, 
                transparent 210deg, 
                rgba(255, 230, 0, 1) 220deg, 
                transparent 225deg, 
                rgba(255, 230, 0, 1) 235deg, 
                transparent 240deg, 
                rgba(255, 230, 0, 1) 250deg, 
                transparent 255deg, 
                rgba(255, 230, 0, 1) 265deg, 
                transparent 270deg, 
                rgba(255, 230, 0, 1) 280deg, 
                transparent 285deg, 
                rgba(255, 230, 0, 1) 295deg, 
                transparent 300deg, 
                rgba(255, 230, 0, 1) 310deg, 
                transparent 315deg, 
                rgba(255, 230, 0, 1) 325deg, 
                transparent 330deg, 
                rgba(255, 230, 0, 1) 340deg, 
                transparent 345deg, 
                rgba(255, 230, 0, 1) 355deg, 
                transparent 360deg
            );
            border-radius: 50%;
            animation: sunRotate 8s linear infinite;
            mix-blend-mode: screen;
        }

        @keyframes sunPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }

        @keyframes sunRotate {
            from {
                transform: rotate(0deg);

            to {
                transform: rotate(360deg);

        /* 动态阳光元素样式 */
        .sunlight {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sunlight::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ffd700, #ff9800, #ff7f00);

                rgba(255, 230, 0, 1) 10deg,

                rgba(255, 230, 0, 1) 25deg,

                rgba(255, 230, 0, 1) 55deg, 
                transparent 60deg, 
                rgba(255, 230, 0, 1) 70deg, 
                transparent 75deg, 
                rgba(255, 230, 0, 1) 85deg, 
                transparent 90deg, 
                rgba(255, 230, 0, 1) 100deg, 
                transparent 105deg, 
                rgba(255, 230, 0, 1) 115deg, 
                transparent 120deg, 
                rgba(255, 230, 0, 1) 130deg, 
                transparent 135deg, 
                rgba(255, 230, 0, 1) 145deg, 
                transparent 150deg, 
                rgba(255, 230, 0, 1) 160deg, 
                transparent 165deg, 
                rgba(255, 230, 0, 1) 175deg, 
                transparent 180deg, 
                rgba(255, 230, 0, 1) 190deg, 
                transparent 195deg, 
                rgba(255, 230, 0, 1) 205deg, 
                transparent 210deg, 
                rgba(255, 230, 0, 1) 220deg, 
                transparent 225deg, 
                rgba(255, 230, 0, 1) 235deg, 
                transparent 240deg, 
                rgba(255, 230, 0, 1) 250deg, 
                transparent 255deg, 
                rgba(255, 230, 0, 1) 265deg, 
                transparent 270deg, 
                rgba(255, 230, 0, 1) 280deg, 
                transparent 285deg, 
                rgba(255, 230, 0, 1) 295deg, 
                transparent 300deg, 
                rgba(255, 230, 0, 1) 310deg, 
                transparent 315deg, 
                rgba(255, 230, 0, 1) 325deg, 
                transparent 330deg, 
                rgba(255, 230, 0, 1) 340deg, 
                transparent 345deg, 
                rgba(255, 230, 0, 1) 355deg, 
                transparent 360deg
            );
            border-radius: 50%;
            animation: sunRotate 8s linear infinite;
            mix-blend-mode: screen;
        }

        /* 经文选择按钮 - 固定在木鱼图片右下角 */
        .scripture-toggle-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: radial-gradient(circle, #5a6b7c 0%, #3a4b5c 100%); /* 铜青渐变 */
            border: 2px solid #7a9bae; /* 钢青边框 */
            color: #c1e1c1; /* 月白 */
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 30, 60, 0.4);

            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(0, 50, 100, 0.5);

        .scripture-toggle-btn:active {

        }

        /* 弹出框覆盖层 - 全屏半透明背景, 用作选择经文功能 */
        .scripture-popup {

            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;

            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .scripture-popup.active {
            opacity: 1;
            visibility: visible;
        }

        /* 弹出框内容 - 适中大小，适合移动设备 */
        .popup-content {
            background: linear-gradient(145deg, #1a2a3a, #2a3a4a); /* 青瓷渐变 */
            border: 2px solid #7a9bae; /* 钢青边框 */

            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        /* 后代选择器 */
        .scripture-popup.active .popup-content {
            transform: translateY(0);
        }

        /* ===== 弹窗系统：青瓷质感 ===== */
        .scripture-popup, .comment-popup, .history-comments-popup {
            background: rgba(5, 20, 40, 0.85); /* 深青底 */
            backdrop-filter: blur(3px);
        }

        /* 弹出框头部 */
        .popup-header {
            padding: 15px 20px;
            background: rgba(30, 60, 90, 0.4);
            border-bottom: 1px solid #7a9bae;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-header h3 {
            color: #a8d8b9; /* 竹青 */
            font-family: 'STKaiti', 'KaiTi', serif;
            font-size: 1.3rem;
            margin: 0;
        }

        .close-popup {
            background: none;
            border: none;
            color: #a8d8b9;
            font-size: 1.8rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-popup:hover {
            background: rgba(100, 180, 180, 0.2);
        }

        /* 弹出框主体 */
        .popup-body {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        /* 移动端优化的选择框 */
        .mobile-selector {
            width: 100%;
            padding: 14px;
            background: rgba(25, 50, 80, 0.8);
            border: 2px solid #7a9bae;
            border-radius: 12px;
            font-family: 'SimSun', 'Microsoft YaHei', sans-serif;
            font-size: 1.15rem;
            color: #e6f4f1;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath         fill='%236d4c41' d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            box-sizing: border-box;
        }

        .mobile-selector:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.3);
        }

        /* 弹出框底部按钮 */
        .popup-footer {
            padding: 15px 20px;
            border-top: 1px solid #8b7355;
            background: rgba(0, 0, 0, 0.1);
        }

        .popup-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            background: linear-gradient(to bottom, #5a7a8c, #3a5a6c); /* 青铜渐变 */
            color: #e6f4f1;
            border: 1px solid #7a9bae;
        }

        .popup-btn:hover {
            background: linear-gradient(to bottom, #6a8a9c, #4a6a7c);
        }

        /* 历史评论按钮样式 */
        .popup-footer .history-btn {
            background: rgba(40, 70, 100, 0.7);
            color: #a8d8b9;
            border: 1px solid rgba(100, 180, 180, 0.4);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            margin-right: auto; /* 推到左侧 */
        }
        
        .popup-footer .history-btn:hover {
            background: rgba(50, 80, 110, 0.8);
            border-color: #a8d8b9;
            transform: translateY(-1px);
        }
        
        .popup-footer .history-btn svg {
            vertical-align: middle;
        }
        
        /* 历史评论弹窗样式 */
        .history-comments-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .popup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }
        
        .history-popup-content {
            background: linear-gradient(135deg, #1a2a3a, #0a1a2a); /* 水墨渐变 */
            border: 2px solid #7a9bae;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 600px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .history-popup-content .popup-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .history-popup-content .popup-header h3 {
            color: #ffd700;
            font-size: 1.2rem;
            margin: 0;
            font-family: 'SimSun', 'Microsoft YaHei', sans-serif;
        }
        
        .history-popup-content .popup-body {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(90vh - 140px);
        }
        
        .history-popup-content .current-line-preview {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            border-left: 3px solid #ffd700;
        }
        
        .history-popup-content .current-line-preview p {
            color: #e0e0e0;
            margin: 5px 0 0 0;
            font-family: 'SimSun', 'Microsoft YaHei', sans-serif;
            font-size: 1.05rem;
            line-height: 1.4;
        }
        
        .history-selector {
            margin: 15px 0;
        }
        
        .history-selector label {
            display: block;
            margin-bottom: 5px;
            color: #ffd700;
            font-weight: bold;
        }
        
        .history-select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(40, 50, 70, 0.8);
            color: #ffffff;
            font-family: 'Microsoft YaHei', sans-serif;
            font-size: 1rem;
        }
        
        .comment-display-area {
            margin-top: 20px;
            padding: 15px;
            background: rgba(15, 35, 55, 0.7);
            border-left: 3px solid #5a7a8c; /* 青铜竖线 */
            border-radius: 8px;
        }
        
        .comment-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }

        /* 历史评论弹窗元数据样式 */
        .comment-meta-info {
            display: block;
            margin-top: 4px;
            color: #a8b8c8;
            font-size: 0.8rem;
            font-style: italic;
        }
        
        .comment-content {
            color: #e6f4f1;
            line-height: 1.5;
            font-family: 'STKaiti', 'KaiTi', serif;
            font-size: 1.05rem;
            min-height: 80px;
            text-align: left !important;
            word-wrap: break-word;
        }
        
        .history-popup-content .popup-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: flex-end;
        }
        
        .history-popup-content .close-popup {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 1.5rem;
            width: 30px;
            height: 30px;
            cursor: pointer;
            position: relative;
            top: -5px;
        }
        
        .history-popup-content .close-popup:hover {
            color: #ff6b6b;
        }
        
        .popup-footer-buttons {
            display: flex;
            gap: 10px;
        }
        
        /* 弹窗动画 */
        @keyframes popupFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .history-popup-content {
            animation: popupFadeIn 0.3s ease-out forwards;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .history-popup-content {
                width: 95%;
                margin: 10px;
            }
            
            .popup-footer .history-btn {
                font-size: 0.85rem;
                padding: 6px 10px;
            }
        }

        .loading-indicator {
            display: flex;
            justify-content: center;

</head>

<script>
    // 音效
    const audioData = {
        clickSound: "audio/MuYu.mp3",
        sunSound: "audio/Sun.mp3"
    };

    // 前端调试模式, 在URL后跟"?debug=true"开启
    const debugMode = new URLSearchParams(window.location.search).get('debug') === 'true';
    function debugLog(...args) {
        if (debugMode) {
            console.log('[DEBUG]', ...args);
        }
    }

    // 全局变量
    let  g_sunlightPool;            // 阳光对象池
    let  g_originSunElement;        // 阳光回归位置图标
    let  g_currentTextIndex = 0;    // 行号 [0, Scriptures.length)
    let  g_moralCounter     = 0;    // 功德计数

    let scriptureToggleBtn = null;
    let scripturePopup = null;
    let scriptureSelector = null;
    let closePopupBtn = null;
    let confirmScriptureBtn = null;
    let textDisplay = null;
    let g_currentScriptureFile = null; // 跟踪当前文本文件

    const Scriptures = [];    // 经文内容
    const g_audioCache = {};  // 音效缓存


    // DOM 元素
    const clickBtn = document.getElementById('clickBtn');

    // 获取木鱼元素
    const MuYu = document.getElementById('MuYu');
    const MuYuImage = document.getElementById('MuYuImage');
    const MuYuRect = MuYuImage.getBoundingClientRect();
    const originSun = document.getElementById('originSun');
    const TextDisplay = document.getElementById('TextDisplay');
    const enableSunlightCheckbox = document.getElementById('enableSunlight'); // 阳光控制勾选框

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', initApp);

// --------------------------- audio --------------------------- //
    // 预加载音频
    function preloadAudio() 
    {
        ['clickSound', 'sunSound'].forEach(key => {
            const audio = new Audio(audioData[key]);
            g_audioCache[key] = audio;
        });
        debugLog("preloadAudio finish.");
    }

    // 播放音效
    function playSound(key) 
    {
        if (!g_audioCache[key]) return;
        
        // 克隆音频元素以支持多重播放
        const audio = g_audioCache[key].cloneNode();
        audio.volume = 0.3;
        audio.play().catch(e => console.log('Audio play failed', e));
    }
// --------------------------- audio end------------------------ //


// --------------------------- TextSelect --------------------------- //
    // 初始化文本选择功能
    function initTextSelector() {
        // 获取DOM元素
        scriptureToggleBtn = document.getElementById('scriptureToggleBtn');
        scripturePopup = document.getElementById('scripturePopup');
        scriptureSelector = document.getElementById('scriptureSelector');
        closePopupBtn = document.getElementById('closePopup');
        confirmScriptureBtn = document.getElementById('confirmScriptureBtn');
        textDisplay = document.getElementById('TextDisplay');
        
        // 检查元素是否存在
        if (!scriptureToggleBtn || !scripturePopup || !scriptureSelector) {
            console.error('经文选择器元素未找到');
            return;
        }
        
        // 添加事件监听
        scriptureToggleBtn.addEventListener('click', openScripturePopup);
        closePopupBtn.addEventListener('click', closeScripturePopup);
        confirmScriptureBtn.addEventListener('click', loadSelectedScripture);
        
        // 点击覆盖层关闭弹出框
        scripturePopup.addEventListener('click', (e) => {
            if (e.target === scripturePopup) {
                closeScripturePopup();
            }
        });
        
        // 按ESC键关闭弹出框
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && scripturePopup.classList.contains('active')) {
                closeScripturePopup();
            }
        });

        // 加载经文列表
        loadScriptureList();
        debugLog("initTextSelector finish.");
    }

    // 打开弹出框
    function openScripturePopup() {
        scripturePopup.classList.add('active');
        document.body.style.overflow = 'hidden'; // 防止背景滚动
        scriptureSelector.focus();
    }
    
    // 关闭弹出框
    function closeScripturePopup() {
        scripturePopup.classList.remove('active');
        document.body.style.overflow = 'auto'; // 恢复背景滚动
    }

    // 从后端加载经文列表
    async function loadScriptureList() {
        try {
            confirmScriptureBtn.disabled = true;
            confirmScriptureBtn.innerHTML = '<div class="loading-indicator"><div class="spinner"></div></div>';
            
            const response = await fetch('/api/resources/Jing');
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const files = await response.json();

            // 清空现有选项（保留默认选项）
            while (scriptureSelector.options.length > 1) {
                scriptureSelector.remove(1);
            }

            // 添加新选项
            files.forEach(file => {
                const option = document.createElement('option');
                option.value = file;
                option.textContent = file.replace(/\.[^/.]+$/, ""); // 移除扩展名显示
                scriptureSelector.appendChild(option);
            });
        
        } catch (error) {
            console.error('加载经文列表失败:', error);
            alert('加载经文列表失败，请检查网络连接');
        } finally {
            confirmScriptureBtn.disabled = false;
            confirmScriptureBtn.textContent = '确定';
        }

        debugLog("loadScriptureList finish.");
    }

    // 加载选中的经文
    async function loadSelectedScripture() {
        const selectedFile = scriptureSelector.value;

        try {

            // 1. 先保存当前经文的阅读进度（如果存在）
            if (g_currentScriptureFile) {
                await saveCurrentReadingProgress();
            }

            // 2. 处理"不使用经文"选项
            if (!selectedFile || selectedFile === "") {
                // 清除当前经文
                g_currentScriptureFile = null;
                Scriptures.length = 0;
                g_currentTextIndex = 0;
                closeScripturePopup();
                return;
            }

            confirmScriptureBtn.disabled = true;
            confirmScriptureBtn.innerHTML = '<div class="loading-indicator"><div class="spinner"></div></div>';

            const response = await fetch(`/api/resources/Jing/${encodeURIComponent(selectedFile)}`);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            // 4. 保存新经文文件名
            const previousFile = g_currentScriptureFile;
            g_currentScriptureFile = selectedFile;
            
            // 5. 清空并存储新经文
            Scriptures.length = 0;
            Scriptures.push(...data.content);
            
            // 6. 获取上次阅读进度
            g_currentTextIndex = await loadLocalOrServerProgress(selectedFile);
            
            // 确保索引在有效范围内
            if (g_currentTextIndex >= Scriptures.length) {
                g_currentTextIndex = 0;
            }


            // 7. 显示加载消息
            const fileNameWithoutExt = selectedFile.replace(/\.txt$/, '');

            // 8. 关闭弹出框
            closeScripturePopup();

        } catch (error) {
            console.error('加载经文内容失败:', error);

            // 发生错误时恢复之前的经文（如果存在）
            if (g_currentScriptureFile && Scriptures.length === 0) {
                // 尝试重新加载之前的经文（简化版）
                console.log('尝试恢复之前的经文状态');
            }
        } finally {
            confirmScriptureBtn.disabled = false;
            confirmScriptureBtn.textContent = '确定';
        }
    }

    // 保存当前经文的阅读进度
    async function saveCurrentReadingProgress() {
        // 没有当前经文文件或经文数据为空，不保存
        if (!g_currentScriptureFile || Scriptures.length === 0) {
            return;
        }

        try {
            const response = await fetch('/api/save-reading-progress', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    filename: g_currentScriptureFile,
                    // 行号 [0, Scriptures.length)
                    currentIndex: g_currentTextIndex
                })
            });

            if (response.ok) {
                console.log(`Saved reading progress for ${g_currentScriptureFile}: line ${g_currentTextIndex}`);
                return true;
            } else {
                const errorData = await response.json();
                console.warn('Failed to save reading progress:', errorData.message);
                return false;
            }
        } catch (error) {
            console.error('Error saving reading progress:', error);
            // 使用localStorage作为备用保存
            saveToLocalProgress(g_currentScriptureFile, g_currentTextIndex);
            return false;
        }
    }

    // 本地存储作为备用方案
    function saveToLocalProgress(filename, index) {
        try {
            const progressData = {
                lastIndex: index,
                timestamp: new Date().toISOString(),
                fileName: filename
            };
            localStorage.setItem(`readingProgress_${filename}`, JSON.stringify(progressData));
            console.log(`Saved reading progress to localStorage for ${filename}: line ${index}`);
        } catch (e) {
            console.error('Failed to save to localStorage:', e);
        }
    }

    // 从本地存储加载阅读进度
    async function loadLocalOrServerProgress(filename) {
        try {
            // 首先尝试从服务器加载
            const serverResponse = await fetch(`/api/get-reading-progress/${encodeURIComponent(filename)}`);

            if (serverResponse.ok) {
                const serverData = await serverResponse.json();
                if (serverData.lastIndex !== undefined) {
                    console.log(`Loaded server progress for ${filename}: line ${serverData.lastIndex}`);
                    return serverData.lastIndex;
                }
            }
        } catch (serverError) {
            console.warn('Failed to load server progress:', serverError);
        }

        // 服务器加载失败或没有进度，尝试从本地加载
        try {
            const localData = localStorage.getItem(`readingProgress_${filename}`);
            if (localData) {
                const progress = JSON.parse(localData);
                // 只接受7天内的本地进度
                const daysOld = (new Date() - new Date(progress.timestamp)) / (1000 * 60 * 60 * 24);
                if (daysOld < 7) {
                    console.log(`Loaded local progress for ${filename}: line ${progress.lastIndex} (${daysOld.toFixed(1)} days old)`);
                    return progress.lastIndex;
                }
            }
        } catch (localError) {
            console.error('Failed to load local progress:', localError);
        }

        // 都没有，返回0
        return 0;
    }

    // 增强的页面卸载处理
    function initProgressSaving() {
        // 1. 页面可见性变化
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'hidden' && g_currentScriptureFile) {
                await saveCurrentReadingProgress();
            }
        });

        // 2. 页面隐藏（移动端优化）
        window.addEventListener('pagehide', async (event) => {
            if (g_currentScriptureFile) {
                // iOS设备上，使用同步XHR确保保存
                if (event.persisted || /iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    saveReadingProgressSync();
                } else {
                    await saveCurrentReadingProgress();
                }
            }
        });

        // 3. 页面卸载（使用Beacon API）
        window.addEventListener('unload', () => {
            if (g_currentScriptureFile && navigator.sendBeacon) {
                const data = {
                    filename: g_currentScriptureFile,
                    // 行号 [0, Scriptures.length)
                    currentIndex: g_currentTextIndex
                };
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                navigator.sendBeacon('/api/save-reading-progress', blob);
                debugLog('Reading progress sent via Beacon API on unload');
            }
        });

        // 4. 同步保存方法（用于关键场景）
        window.saveReadingProgressSync = function() {
            if (!g_currentScriptureFile) return;

            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/save-reading-progress', false); // 同步请求
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.send(JSON.stringify({
                    filename: g_currentScriptureFile,
                    currentIndex: g_currentTextIndex
                }));

                if (xhr.status === 200) {
                    console.log(`Sync saved reading progress for ${g_currentScriptureFile}: line ${g_currentTextIndex}`);
                }
            } catch (error) {
                console.error('Sync save failed:', error);
                // 失败时尝试本地存储
                saveToLocalProgress(g_currentScriptureFile, g_currentTextIndex);
            }
        };

        debugLog("initProgressSaving finish.");
    }

        // 保存评论到服务器
        async function saveCommentToServer() {
            const currentLineIndex = g_currentTextIndex > 0 ? g_currentTextIndex : 0;
            const currentLineContent = Scriptures[currentLineIndex] || '';
            const theme = themeInput.value.trim();
            const comment = commentInput.value.trim();
                
            try {
                const response = await fetch('/api/save-comment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json', // 明确告知服务器我们期望JSON响应
                        'X-Requested-With': 'XMLHttpRequest' // 标识这是一个AJAX请求
                    },
                    body: JSON.stringify({
                        filename: g_currentScriptureFile,
                        lineNumber: currentLineIndex + 1,
                        lineContent: currentLineContent,
                        theme: theme,
                        comment: comment,
                        timestamp: new Date().toISOString()
                    }),
                    credentials: 'same-origin' // 确保cookie随请求发送
                });
                
                // 检查响应状态
                if (!response.ok) {
                    // 尝试解析JSON，如果失败则尝试获取文本
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (jsonError) {
                        // 响应不是JSON，可能是HTML错误页面
                        const text = await response.text();
                        throw new Error(`服务器错误: HTTP ${response.status} ${response.statusText}\n\n服务器返回了非JSON响应，可能是配置错误或页面未找到。`);
                    }
                    throw new Error(errorData.message || `保存失败: HTTP ${response.status}`);
                }
                
                // 检查响应内容类型
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    // 检查是否是常见的错误页面
                    if (text.includes('<!DOCTYPE html>') || text.includes('<html')) {
                        throw new Error('服务器返回了HTML页面而非JSON数据。请检查API端点配置是否正确。');
                    }
                    throw new Error('服务器返回了非JSON格式的响应');
                }
                
                // 一切正常，解析JSON
                const result = await response.json();
                
                if (result.success) {
                    return true;
                } else {
                    throw new Error(result.message || '评论保存失败');
                }
                
            } catch (error) {
                console.error('保存评论时发生错误:', error);
                
                // 提供更详细的错误信息
                let errorMessage = '保存评论失败';
                if (error.message.includes('Unexpected token')) {
                    errorMessage = '服务器配置错误：返回了HTML页面而非JSON数据';
                } else if (error.message.includes('Failed to fetch') || error.name === 'TypeError') {
                    errorMessage = '无法连接到服务器，请检查网络连接或服务器状态';
                } else if (error.message.includes('HTTP 404')) {
                    errorMessage = 'API端点未找到，请检查服务器路由配置';
                } else if (error.message.includes('HTTP 401') || error.message.includes('HTTP 403')) {
                    errorMessage = '权限不足，您可能需要登录才能评论';
                } else {
                    errorMessage = error.message;
                }
                
                // 显示友好错误消息
                showTemporaryMessage(errorMessage, 'error', { duration: 6000 });
                throw error; // 重新抛出错误以便调用者处理
            }
        }

    // 显示历史评论弹窗 - 按文件记录
    function showHistoryCommentsPopup(fileName, comments) {
        const popup = document.getElementById('historyCommentsPopup');
        if (!popup) return;

        // 设置文件信息
        document.getElementById('historyFileInfo').textContent = fileName;

        // 填充下拉框
        const selectElement = document.getElementById('commentHistorySelect');
        selectElement.innerHTML = '<option value="">-- 选择记忆点 --</option>';

        if (comments.length === 0) {
            showTemporaryMessage('当前经文暂无记忆', 'info', { duration: 2000 });
            selectElement.disabled = true;
            document.getElementById('commentContentDisplay').textContent = '当前经文没有记忆点';
            document.getElementById('commentMetaInfo').textContent = '';
        } else {
            selectElement.disabled = false;

            comments.forEach(comment => {
                const option = document.createElement('option');
                const displayTime = formatCommentTime(comment.timestamp);
                option.value = comment.id;
                option.textContent = ` ${displayTime} -  ${comment.theme.substring(0, 10)} ${comment.theme.length > 10 ? '...' : ''}`;
                option.dataset.comment = JSON.stringify(comment);
                selectElement.appendChild(option);
            });

            // 默认选择第一条
            selectElement.value = comments[0].id;
            displaySelectedComment(comments[0].id);
        }

        // 显示弹窗
        popup.style.display = 'flex';

        // 添加ESC键关闭支持
        document.addEventListener('keydown', handleHistoryEscapeKey);
    }

    // 显示选中的评论
    function displaySelectedComment(commentId) {
        const selectElement = document.getElementById('commentHistorySelect');
        const selectedOption = Array.from(selectElement.options).find(opt => opt.value === commentId);
        
        if (selectedOption && selectedOption.dataset.comment) {
            try {
                const comment = JSON.parse(selectedOption.dataset.comment);
                document.getElementById('commentContentDisplay').textContent = comment.comment || '无记忆';

                // 显示元数据
                let metaText = `创建于:  ${formatCommentTime(comment.timestamp)}`;
                if (comment.lineNumber) {
                    metaText += ` | 行:  ${comment.lineNumber}`;
                }
                if (comment.lineContent) {
                    metaText += ` | 内容:  ${comment.lineContent.substring(0, 20)} ${comment.lineContent.length > 20 ? '...' : ''}`;
                }
                document.getElementById('commentMetaInfo').textContent = metaText;
            } catch (e) {
                console.error('解析记忆数据失败:', e);
                document.getElementById('commentContentDisplay').textContent = '记忆读取失败';
                document.getElementById('commentMetaInfo').textContent = '记忆元数据读取失败';
            }
        }
    }

    // 格式化评论时间
    function formatCommentTime(timestamp) {
        try {
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return '未知时间';

            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');

            return ` ${year}- ${month}- ${day}  ${hours}: ${minutes}`;
        } catch (e) {
            console.error('格式化时间出错:', e);
            return '未知时间';
        }
    }

    // 关闭历史评论弹窗
    function closeHistoryCommentsPopup() {
        const popup = document.getElementById('historyCommentsPopup');
        if (popup) {
            popup.style.display = 'none';
        }

        // 移除ESC键监听
        document.removeEventListener('keydown', handleHistoryEscapeKey);
    }

    // 处理ESC键
    function handleHistoryEscapeKey(e) {
        if (e.key === 'Escape') {
            closeHistoryCommentsPopup();
        }
    }

// 阳光类
class Sunlight 
{
    constructor(element) {
        this.element = element;
        this.isMoving = false;          // 刚创建向随机方向移动
        this.isReturning = false;       // 被点击向固定位置移动
        this.timeoutId = null;          // 定时器
        this.animationFrameId = null;   // 移动动画相关
        this.x = 0;
        this.y = 0;
        this.targetX = 0;
        this.targetY = 0;
        this.movingDuration = 0;        // 移动持续时间
        this.startTime = 0;             // 开始时间
        this.originSunRect = null;      // 初始阳光图标位置
    }

    // 初始化阳光元素
    init(startX, startY, originSunRect) {
        this.element.style.left = `${startX}px`;
        this.element.style.top = `${startY}px`;
        this.element.style.display = 'block';
        
        // 记录初始阳光初始化位置
        this.originSunRect = originSunRect;
        
        // 设置移动范围
        const moveRange = 100;
        const minX = Math.max(0, startX - moveRange);
        const maxX = Math.min(window.innerWidth - 40, startX + moveRange);
        const minY = Math.max(0, startY - moveRange);
        const maxY = Math.min(window.innerHeight - 40, startY + moveRange);

        // 生成随机目标位置
        this.targetX = Math.max(minX, Math.min(maxX, Math.random() * (maxX - minX) + minX));
        this.targetY = Math.max(minY, Math.min(maxY, Math.random() * (maxY - minY) + minY));
        
        this.x = startX;
        this.y = startY;
        this.isMoving = true;
        this.isReturning = false;
        
        // 开始移动动画
        this.movingDuration = 1000; // 1秒
        this.startTime = Date.now();
        this.animateMovement();
        
        // 绑定点击事件
        this.element.addEventListener('click', () => this.SunhandleClick());
    }

    // 移动动画
    animateMovement() {
        if (!this.isMoving && !this.isReturning) {
            return;
        }
        
        const now = Date.now();
        const elapsed = now - this.startTime;
        const progress = Math.min(elapsed / this.movingDuration, 1);
        
        if (progress < 1) {
            if (this.isReturning) // 向初始阳光图标移动
            {
                // 获取初始阳光实时位置
                const oriSunRect = document.getElementById('originSun').getBoundingClientRect();
                if(oriSunRect)
                {
                    this.x += (this.originSunRect.left + this.originSunRect.width/2 - this.x) * 0.1;
                    this.y += (this.originSunRect.top + this.originSunRect.height/2 - this.y) * 0.1;
                }
                else
                {
                    // 获取实时位置失败，使用初始化位置
                    this.x += (this.originSunRect.left + this.originSunRect.width/2 - this.x) * 0.1;
                    this.y += (this.originSunRect.top + this.originSunRect.height/2 - this.y) * 0.1;
                }
            } 
            else // 向随机点移动
            {
                this.x = this.x + (this.targetX - this.x) * progress;
                this.y = this.y + (this.targetY - this.y) * progress;
            }
            
            this.element.style.left = `${this.x}px`;
            this.element.style.top = `${this.y}px`;
            
            this.animationFrameId = requestAnimationFrame(() => this.animateMovement());
        } 
        else 
        {
            // 移动完成
            this.isMoving = false;
            this.element.style.left = `${this.targetX}px`;
            this.element.style.top = `${this.targetY}px`;

            if(this.isReturning)
            {
                this.destroy();
            }
            else // 3-5秒后消失
            {
                const delay = 3000 + Math.random() * 2000;
                this.timeoutId = setTimeout(() => {
                    this.destroy();
                }, delay);
            }

        }
    }

    // 处理点击事件
    SunhandleClick() {
        if (this.isReturning) return;
        
        // 播放音效
        playSound('sunSound');
        
        // 清除原有动画和定时器
        cancelAnimationFrame(this.animationFrameId);
        if (this.timeoutId) clearTimeout(this.timeoutId);
        
        // 创建"道德+1"效果
        createMoralPlusOne(this.originSunRect.left, this.originSunRect.top-10);
        
        // 开始返回到初始阳光图标的动画
        this.isReturning = true;
        this.movingDuration = 500; // 0.5秒
        this.startTime = Date.now();
        this.animateMovement();
    }

    // 销毁阳光元素
    destroy() {
        cancelAnimationFrame(this.animationFrameId);
        if (this.timeoutId) clearTimeout(this.timeoutId);
        
        this.element.style.display = 'none';
        
        // 返回到对象池
        g_sunlightPool.returnObject(this);
    }
}

// 对象池类
class ObjectPool 
{
    constructor(createFunc, maxSize = 15) {
        this.pool = [];
        this.createFunc = createFunc;
        this.maxSize = maxSize;
    }
    
    getObject() {
        if (this.pool.length > 0) {
            return this.pool.pop();
        }
        return this.createFunc();
    }
    
    returnObject(obj) {
        if (this.pool.length < this.maxSize) {
            this.pool.push(obj);
        } else {
            // 池已满，销毁对象
            obj.element.remove();
        }
    }
    
    clear() {
        while (this.pool.length > 0) {
            const obj = this.pool.pop();
            obj.element.remove();
        }
        this.pool = [];
    }
}

/**
 * 显示临时消息提示
 * @param {string} message - 要显示的消息内容，支持HTML
 * @param {string} type - 消息类型: 'success', 'error', 'warning', 'info'
 * @param {Object} options - 配置选项
 * @param {number} [options.duration=3000] - 显示持续时间(毫秒)
 * @param {boolean} [options.allowHTML=true] - 是否允许HTML内容
 * @param {Function} [options.onClose] - 关闭时的回调函数
 */
function showTemporaryMessage(message, type = 'info', options = {}) {
    // 合并默认选项
    const config = {
        duration: options.duration || 3000,
        allowHTML: options.allowHTML !== undefined ? options.allowHTML : true,
        onClose: options.onClose || null
    };

    // 消息容器 - 使用全局唯一的容器
    let messageContainer = document.getElementById('temporary-messages-container');
    if (!messageContainer) {
        messageContainer = document.createElement('div');
        messageContainer.id = 'temporary-messages-container';
        messageContainer.style.position = 'fixed';
        messageContainer.style.top = '20px';
        messageContainer.style.right = '20px';
        messageContainer.style.zIndex = '9999';
        messageContainer.style.display = 'flex';
        messageContainer.style.flexDirection = 'column';
        messageContainer.style.gap = '10px';
        document.body.appendChild(messageContainer);
    }

    // 创建消息元素
    const messageElement = document.createElement('div');
    messageElement.className = `temporary-message ${type}`;
    messageElement.style.position = 'relative';
    messageElement.style.minWidth = '280px';
    messageElement.style.padding = '12px 16px 12px 40px';
    messageElement.style.borderRadius = '8px';
    messageElement.style.marginBottom = '10px';
    messageElement.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.15)';
    messageElement.style.transform = 'translateX(120%)';
    messageElement.style.opacity = '0';
    messageElement.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
    messageElement.style.fontFamily = "'Microsoft YaHei', 'SimSun', sans-serif";
    messageElement.style.fontSize = '0.95rem';
    messageElement.style.lineHeight = '1.4';
    
    // 设置背景和文字颜色
    let bgColor, textColor, iconContent, iconColor;
    switch (type) {
        case 'success':
            bgColor = 'rgba(40, 167, 69, 0.9)';
            textColor = '#ffffff';
            iconContent = '✓';
            iconColor = '#ffffff';
            break;
        case 'error':
            bgColor = 'rgba(220, 53, 69, 0.9)';
            textColor = '#ffffff';
            iconContent = '×';
            iconColor = '#ffffff';
            break;
        case 'warning':
            bgColor = 'rgba(255, 193, 7, 0.9)';
            textColor = '#212529';
            iconContent = '!';
            iconColor = '#212529';
            break;
        case 'info':
        default:
            bgColor = 'rgba(23, 162, 184, 0.9)';
            textColor = '#ffffff';
            iconContent = 'i';
            iconColor = '#ffffff';
            break;
    }
    
    messageElement.style.backgroundColor = bgColor;
    messageElement.style.color = textColor;

    // 添加图标
    const iconElement = document.createElement('div');
    iconElement.style.position = 'absolute';
    iconElement.style.left = '12px';
    iconElement.style.top = '50%';
    iconElement.style.transform = 'translateY(-50%)';
    iconElement.style.width = '18px';
    iconElement.style.height = '18px';
    iconElement.style.borderRadius = '50%';
    iconElement.style.backgroundColor = 'rgba(255, 255, 255, 0.3)';
    iconElement.style.color = iconColor;
    iconElement.style.display = 'flex';
    iconElement.style.alignItems = 'center';
    iconElement.style.justifyContent = 'center';
    iconElement.style.fontSize = '0.8rem';
    iconElement.style.fontWeight = 'bold';
    iconElement.style.fontFamily = 'Arial, sans-serif';
    iconElement.textContent = iconContent;
    messageElement.appendChild(iconElement);

    // 设置消息内容
    const messageContentElement = document.createElement('div');
    messageContentElement.style.wordWrap = 'break-word';
    
    if (config.allowHTML) {
        // 简单的XSS防护 - 移除危险标签
        const cleanMessage = sanitizeHTML(message);
        messageContentElement.innerHTML = cleanMessage;
    } else {
        messageContentElement.textContent = message;
    }
    
    messageElement.appendChild(messageContentElement);

    // 添加关闭按钮
    const closeBtn = document.createElement('button');
    closeBtn.innerHTML = '&times;';
    closeBtn.style.position = 'absolute';
    closeBtn.style.top = '4px';
    closeBtn.style.right = '8px';
    closeBtn.style.background = 'none';
    closeBtn.style.border = 'none';
    closeBtn.style.color = 'rgba(255, 255, 255, 0.7)';
    closeBtn.style.cursor = 'pointer';
    closeBtn.style.fontSize = '1.2rem';
    closeBtn.style.width = '24px';
    closeBtn.style.height = '24px';
    closeBtn.style.display = 'flex';
    closeBtn.style.alignItems = 'center';
    closeBtn.style.justifyContent = 'center';
    closeBtn.style.borderRadius = '50%';
    closeBtn.style.padding = '0';
    closeBtn.style.opacity = '0.7';
    closeBtn.style.transition = 'opacity 0.2s';
    
    closeBtn.onmouseenter = () => { closeBtn.style.opacity = '1'; };
    closeBtn.onmouseleave = () => { closeBtn.style.opacity = '0.7'; };
    
    closeBtn.onclick = (e) => {
        e.stopPropagation();
        removeMessageElement();
    };
    
    messageElement.appendChild(closeBtn);

    // 添加到容器
    messageContainer.appendChild(messageElement);

    // 强制重排以使过渡效果生效
    void messageElement.offsetWidth;
    
    // 显示消息
    setTimeout(() => {
        messageElement.style.transform = 'translateX(0)';
        messageElement.style.opacity = '1';
    }, 10);

    // 设置自动关闭
    const timeoutId = setTimeout(removeMessageElement, config.duration);

    // 鼠标悬停时暂停自动关闭
    let isHovering = false;
    messageElement.addEventListener('mouseenter', () => {
        isHovering = true;
        clearTimeout(timeoutId);
    });

    messageElement.addEventListener('mouseleave', () => {
        isHovering = false;
        setTimeout(() => {
            if (!isHovering) {
                removeMessageElement();
            }
        }, 200);
    });

    // 移除消息元素
    function removeMessageElement() {
        if (!messageElement.parentNode) return;
        
        // 淡出动画
        messageElement.style.transform = 'translateX(120%)';
        messageElement.style.opacity = '0';
        
        setTimeout(() => {
            if (messageElement.parentNode) {
                messageContainer.removeChild(messageElement);
            }
            
            // 如果容器中没有消息了，移除容器
            if (messageContainer.children.length === 0) {
                document.body.removeChild(messageContainer);
            }
            
            // 调用关闭回调
            if (typeof config.onClose === 'function') {
                config.onClose();
            }
        }, 300);
    }

    // 简单的HTML清理函数，防止XSS攻击
    function sanitizeHTML(html) {
        if (!html || typeof html !== 'string') return '';
        
        // 创建一个临时div来解析HTML
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        
        // 递归清理元素
        function cleanNode(node) {
            if (node.nodeType === Node.ELEMENT_NODE) {
                // 移除危险的标签和属性
                const dangerousTags = ['script', 'style', 'iframe', 'object', 'embed', 'form', 'button'];
                const dangerousAttrs = ['onerror', 'onload', 'onmouseover', 'onclick', 'onfocus', 'src', 'href'];
                
                if (dangerousTags.includes(node.tagName.toLowerCase())) {
                    const safeReplacement = document.createTextNode(node.textContent || '');
                    node.parentNode.replaceChild(safeReplacement, node);
                    return;
                }
                
                // 移除危险属性
                for (let i = node.attributes.length - 1; i >= 0; i--) {
                    const attr = node.attributes[i];
                    if (dangerousAttrs.some(da => attr.name.toLowerCase().includes(da)) ||
                        attr.value.toLowerCase().includes('javascript:') ||
                        attr.value.toLowerCase().includes('data:text/html')) {
                        node.removeAttribute(attr.name);
                    }
                }
                
                // 递归处理子节点
                for (let i = 0; i < node.childNodes.length; i++) {
                    cleanNode(node.childNodes[i]);
                }
            }
        }
        
        // 清理所有节点
        for (let i = 0; i < tempDiv.childNodes.length; i++) {
            cleanNode(tempDiv.childNodes[i]);
        }
        
        return tempDiv.innerHTML;
    }
}

                    document.getElementById('moralCounterContainer').classList.add('hidden');

        }
